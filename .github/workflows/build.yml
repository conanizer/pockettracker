name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default also asks for the legacy `tools` package, which
          # the SDK repository no longer serves — sdkmanager exits 1 on it.
          packages: 'platform-tools'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK platform, NDK and CMake
        run: |
          sdkmanager \
            "platforms;android-36" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        run: ./gradlew assembleDebug -PptWerror --no-daemon   # a warning in OUR sources fails the build

      # ─── SDL2 must be IN the APK ─────────────────────────────────────────────────────────────
      # A green build proves SDL2 compiled. Whether a .so exists (SDL_SHARED), is packaged (AGP) and
      # its Java half reaches the DEX (a sourceSet line) is decided elsewhere, and a miss is a crash
      # at launch — so this reads the artifact.
      - name: Assert the APK carries SDL2
        run: |
          # ⚠️ Every check fails explicitly and prints its evidence: with `set -e` and bare tests, an
          # empty lookup once passed over a count of zero.
          FAIL=0
          APK=$(ls app/build/outputs/apk/debug/*.apk)
          echo "APK: $APK"

          # (1) the native library, per ABI.
          for ABI in arm64-v8a x86_64; do
            if unzip -l "$APK" | grep -q "lib/$ABI/libSDL2.so"; then
              echo "ok    lib/$ABI/libSDL2.so"
            else
              echo "FAIL  lib/$ABI/libSDL2.so is not in the APK"; FAIL=1
            fi
          done

          # (2) the JNI entry point SDLActivity calls at start to compare versions. ⚠️ From the
          # dynamic symbol table: the name is in the debug info too, so a grep passes on no export.
          NM=$(find "$ANDROID_SDK_ROOT/ndk" -type f -name llvm-nm | head -1)
          if [ -z "$NM" ] || [ ! -x "$NM" ]; then
            echo "FAIL  llvm-nm not found under $ANDROID_SDK_ROOT/ndk - the symbol check cannot run"
            FAIL=1
          else
            unzip -p "$APK" lib/arm64-v8a/libSDL2.so > /tmp/libSDL2.so
            "$NM" -D --defined-only /tmp/libSDL2.so | grep ' T Java_org_libsdl_app_' > /tmp/sdl-jni.txt || true
            COUNT=$(wc -l < /tmp/sdl-jni.txt)
            if grep -q ' T Java_org_libsdl_app_SDLActivity_nativeGetVersion$' /tmp/sdl-jni.txt; then
              echo "ok    nativeGetVersion exported, with $COUNT org.libsdl.app JNI entry points"
            else
              echo "FAIL  nativeGetVersion is not an exported symbol (found $COUNT entry points)"
              FAIL=1
            fi
            [ "$COUNT" -ge 40 ] || { echo "FAIL  only $COUNT JNI entry points exported, expected >= 40"; FAIL=1; }
          fi

          # (3) the Java half, in the DEX.
          FOUND=0
          for D in $(unzip -l "$APK" | grep -o 'classes[0-9]*\.dex'); do
            if unzip -p "$APK" "$D" | grep -aq 'org/libsdl/app/SDLActivity'; then
              echo "ok    org/libsdl/app/SDLActivity in $D"; FOUND=1
            fi
          done
          [ "$FOUND" -eq 1 ] || { echo "FAIL  org/libsdl/app/SDLActivity is in no classes*.dex"; FAIL=1; }

          exit $FAIL

      # ─── pt-ui compiles with the NDK, and is never packaged as its own .so ─────────────────────
      # ⚠️ AGP compiles only what it packages and what that links. pt-ui is named explicitly, per ABI,
      # in AGP's own configure directory — the shipping toolchain and flags, not a second
      # configuration. Never externalNativeBuild.cmake.targets: a whitelist silently stops packaging
      # the first .so left off it.
      - name: Compile pt-ui with the shipping NDK configuration
        run: |
          # ⚠️ Every check fails explicitly and prints the number it rests on.
          FAIL=0
          NINJA="$ANDROID_SDK_ROOT/cmake/3.22.1/bin/ninja"
          if [ ! -x "$NINJA" ]; then
            echo "FAIL  ninja not found at $NINJA - the compile check cannot run"; exit 1
          fi

          for ABI in arm64-v8a x86_64; do
            # AGP picks the hash in the path: exactly one, or a stale or empty glob decides.
            N=$(ls -d app/.cxx/Debug/*/"$ABI" 2>/dev/null | wc -l)
            if [ "$N" -ne 1 ]; then
              echo "FAIL  expected exactly 1 AGP configure dir for $ABI, found $N"; FAIL=1; continue
            fi
            DIR=$(ls -d app/.cxx/Debug/*/"$ABI")

            if ! "$NINJA" -C "$DIR" pt-ui; then
              echo "FAIL  pt-ui did not compile for $ABI"; FAIL=1; continue
            fi

            # Every translation unit of the target, counted from its own ninja file, has an object.
            AR="$DIR/libpt-ui.a"
            WANT=$("$NINJA" -C "$DIR" -t targets all | grep -c '^CMakeFiles/pt-ui\.dir/.*\.o:')
            OBJS=$(find "$DIR/CMakeFiles/pt-ui.dir" -name '*.o' 2>/dev/null | wc -l)
            if [ -f "$AR" ] && [ "$WANT" -gt 0 ] && [ "$OBJS" -eq "$WANT" ]; then
              echo "ok    $ABI: libpt-ui.a $(stat -c%s "$AR") bytes, from $OBJS of $WANT objects"
            else
              echo "FAIL  $ABI: libpt-ui.a exists=$([ -f "$AR" ] && echo yes || echo no), objects=$OBJS (want $WANT)"
              FAIL=1
            fi
          done

          # pt-ui reaches the APK inside libpockettracker-sdl.so; a libpt-ui.so would be a second,
          # dead copy of the UI.
          APK=$(ls app/build/outputs/apk/debug/*.apk)
          if unzip -l "$APK" | grep -q 'libpt-ui\.so'; then
            echo "FAIL  libpt-ui.so is in the APK - pt-ui is linked into the shell .so, not shipped alone"
            FAIL=1
          else
            echo "ok    no libpt-ui.so in the APK (static archive, linked into the shell .so)"
          fi

          exit $FAIL

      - name: Assert the SDL app links pt-ui and is reachable
        run: |
          # A link line proves nothing about what ended up in the .so: every check reads the artifact.
          FAIL=0
          NDK="$ANDROID_SDK_ROOT/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          NM="$NDK/llvm-nm"
          READELF="$NDK/llvm-readelf"
          for T in "$NM" "$READELF"; do
            if [ ! -x "$T" ]; then echo "FAIL  $T not found - the checks cannot run"; exit 1; fi
          done

          APK=$(ls app/build/outputs/apk/debug/*.apk)

          for ABI in arm64-v8a x86_64; do
            # ── 1. Is it in the APK at all? ──────────────────────────────────────────────────────
            SZ=$(unzip -l "$APK" | awk -v p="lib/$ABI/libpockettracker-sdl.so" '$4==p {print $1}')
            if [ -z "$SZ" ]; then
              echo "FAIL  $ABI: libpockettracker-sdl.so is NOT in the APK"; FAIL=1; continue
            fi
            echo "ok    $ABI: libpockettracker-sdl.so packaged, $SZ bytes"

            # ── 2. SDL_main, in the DYNAMIC symbol table ─────────────────────────────────────────
            # SDLActivity dlsym's it from the last library getLibraries() returns. ⚠️ .dynsym: a grep
            # or a .symtab hit passes on a library that exports nothing.
            unzip -p "$APK" "lib/$ABI/libpockettracker-sdl.so" > /tmp/sdl-$ABI.so
            N=$("$READELF" --dyn-syms /tmp/sdl-$ABI.so | grep -cw "SDL_main")
            if [ "$N" -ge 1 ]; then
              echo "ok    $ABI: SDL_main exported in .dynsym ($N entries)"
            else
              echo "FAIL  $ABI: SDL_main NOT in .dynsym - SDLActivity would fail to find the entry point"
              FAIL=1
            fi

            # ── 3. Is pt-ui actually INSIDE it? ──────────────────────────────────────────────────
            # ⚠️ The unstripped intermediate: pt::ui symbols are internal, and the APK copy is
            # stripped. Compared against libpt-ui.a's own symbol list, not hand-picked names.
            D=$(ls -d app/.cxx/Debug/*/"$ABI")
            OBJ=$(ls app/build/intermediates/cxx/Debug/*/obj/"$ABI"/libpockettracker-sdl.so 2>/dev/null | head -1)
            if [ ! -f "$OBJ" ]; then
              echo "FAIL  $ABI: no unstripped libpockettracker-sdl.so to inspect"; FAIL=1; continue
            fi
            "$NM" --defined-only "$D/libpt-ui.a" 2>/dev/null | grep ' T ' | awk '{print $3}' \
              | grep '^_ZN2pt2ui' | sort -u > /tmp/ptui-$ABI.txt
            "$NM" --defined-only "$OBJ" 2>/dev/null | awk '{print $3}' | sort -u > /tmp/so-$ABI.txt
            TOTAL=$(wc -l < /tmp/ptui-$ABI.txt)
            FOUND=$(comm -12 /tmp/ptui-$ABI.txt /tmp/so-$ABI.txt | wc -l)
            if [ "$TOTAL" -gt 0 ] && [ "$FOUND" -eq "$TOTAL" ]; then
              echo "ok    $ABI: $FOUND of $TOTAL pt::ui symbols are defined in the shell .so"
            else
              echo "FAIL  $ABI: only $FOUND of $TOTAL pt::ui symbols reached the .so (0/0 means the check found nothing - fix the check)"
              FAIL=1
            fi
          done

          # ── 4. The launcher, on the merged manifests ─────────────────────────────────────────────
          # MainActivity (the SDL activity) launches release; no SdlActivity in either manifest.
          ./gradlew :app:processReleaseManifest :app:processDebugManifest --rerun-tasks --no-daemon
          RELMF=$(ls app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml)
          DBGMF=$(ls app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml)
          # The retired debug-only activity must be gone from BOTH manifests.
          RN=$(grep -c 'SdlActivity' "$RELMF" || true)
          DN=$(grep -c 'SdlActivity' "$DBGMF" || true)
          # The shipping launcher must be MainActivity, present in RELEASE.
          MAIN=$(grep -c 'MainActivity' "$RELMF" || true)
          if [ "$RN" -eq 0 ] && [ "$DN" -eq 0 ] && [ "$MAIN" -ge 1 ]; then
            echo "ok    launcher: no SdlActivity in either manifest, MainActivity is the release launcher ($MAIN)"
          else
            echo "FAIL  launcher: SdlActivity refs debug=$DN release=$RN (want 0/0), MainActivity in release=$MAIN (want >=1)"
            FAIL=1
          fi

          exit $FAIL

      # ⚠️ No test step: the sequencer and UI are C++, and their regression suite lives outside this
      # repository, where CI cannot reach it.

      # ─── The JNI keep rules, in the only build that can break them ────────────────────────────
      # ⚠️ Every other check reads a DEBUG APK, and debug never runs R8: a missing keep rule for a
      # JNI callback is invisible there and fatal in release. Without keystore.properties the release
      # build signs with the debug key, so CI builds a really minified APK. The names come out of
      # proguard-rules.pro, and their count is checked before anything is compared.
      - name: Build release APK and assert the JNI keep rules survived R8
        run: |
          set -u
          ./gradlew assembleRelease -PptWerror --no-daemon
          FAIL=0
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "apk: $APK"

          # The members pinned on MainActivity, taken from the rules file itself.
          awk '/^-keepclassmembers class com\.conanizer\.pockettracker\.MainActivity \{/{f=1;next} \
               f&&/^\}/{f=0} f' app/proguard-rules.pro \
            | sed 's/(.*//' | awk '{print $NF}' | grep -v '^$' > /tmp/kept.txt
          WANT=$(wc -l < /tmp/kept.txt)
          echo "keep rules parsed: $WANT"
          [ "$WANT" -ge 13 ] || { echo "FAIL  parsed only $WANT names out of proguard-rules.pro"; exit 1; }

          rm -rf /tmp/dexchk && mkdir -p /tmp/dexchk
          unzip -o -q "$APK" 'classes*.dex' -d /tmp/dexchk

          # ⚠️ One grep for both halves: the control proves R8 ran only if measured the same way.
          present=0
          while read -r n; do
            if cat /tmp/dexchk/classes*.dex | grep -a -q -F "$n"; then
              present=$((present+1))
            else
              echo "FAIL  kept member missing from the release DEX: $n"; FAIL=1
            fi
          done < /tmp/kept.txt
          echo "kept members present: $present of $WANT"

          # The control: "13 of 13 present" is true of a DEX R8 never touched too. Five private
          # members with no keep rule must all be renamed. ⚠️ Each must still exist in MainActivity.kt.
          KT=app/src/main/java/com/conanizer/pockettracker/MainActivity.kt
          survived=0
          for n in hideSystemBars askForNotificationsOnce watchScreenRecording onScreenRecording visualizerIndex; do
            if ! grep -q -E "private fun $n\b" "$KT"; then
              echo "FAIL  (control) $n is no longer a private fun of MainActivity.kt - pick another"; FAIL=1
            elif cat /tmp/dexchk/classes*.dex | grep -a -q -F "$n"; then
              echo "FAIL  (control) non-kept private member survived R8: $n"; survived=$((survived+1)); FAIL=1
            fi
          done
          echo "non-kept members surviving: $survived of 5 (want 0 — proves R8 renamed in this build)"
          exit $FAIL

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: pockettracker-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  # ─── The SDL shell ─────────────────────────────────────────────────────────────────────────────
  # The desktop app on Linux and Windows. The two runners also take both branches of
  # shell/CMakeLists.txt's SDL2 lookup: Linux the system's (as on every CFW), Windows the vendored copy.
  shell:
    name: SDL shell (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux-x64 }
          - { os: windows-latest, name: windows-x64 }

    steps:
      - uses: actions/checkout@v7

      # Linux only: Windows builds native/vendor/SDL2 into the exe.
      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      # Release stated: shell/CMakeLists.txt says why.
      - name: Configure
        run: cmake -S shell -B shell/build -DCMAKE_BUILD_TYPE=Release -DPT_WERROR=ON

      - name: Build
        run: cmake --build shell/build --config Release

      # The handheld-only code (PT_HANDHELD), so it is not first compiled on release day.
      - name: Build the handheld variant (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S shell -B shell/build-handheld -DCMAKE_BUILD_TYPE=Release -DPT_WERROR=ON -DPT_HANDHELD=ON
          cmake --build shell/build-handheld

      # `error` on no match: a green job with no artifact would hide a shell no longer produced.
      - name: Upload the shell (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: pockettracker-shell-${{ matrix.name }}
          path: shell/build/pockettracker-sdl
          if-no-files-found: error
          retention-days: 7

      # ─── The Windows package ───────────────────────────────────────────────────────────────────
      # The zip, not the bare exe: it is what reaches a person. build-windows.ps1 checks the artifact.
      # ⚠️ `powershell` (5.1), not the runner's default pwsh 7, which cannot load some of its assemblies.
      - name: Package the Windows desktop zip
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File shell/build-windows.ps1

      - name: Upload the Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: pockettracker-windows-x64
          path: build/windows/*.zip
          if-no-files-found: error
          retention-days: 7
